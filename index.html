<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>GXY Arcade</title>
<link rel="manifest" href="manifest.webmanifest">
<meta name="theme-color" content="#07080f">
<link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
<style>
:root{--bg:#07080f;--card:#141829;--text:#eef0ff;--dim:#9aa0c3;--accent:#3b82f6;--hot:#ff3d81}
*{box-sizing:border-box}
body{margin:0;background:radial-gradient(1200px 600px at 50% -200px,#1d2a5a,transparent),var(--bg);color:var(--text);font-family:system-ui,Segoe UI,sans-serif;min-height:100vh}
header{padding:36px 16px 8px;text-align:center}
h1{margin:0;font:italic 900 clamp(2.2rem,7vw,4rem) 'Arial Black',sans-serif;letter-spacing:2px}
h1 span{color:var(--accent)}
header p{color:var(--dim);margin:6px 0 18px}
.bar{display:flex;gap:8px;justify-content:center;flex-wrap:wrap;max-width:900px;margin:auto}
input,button{font:inherit;padding:8px 14px;border-radius:999px;border:1px solid #2c3252;background:var(--card);color:var(--text);cursor:pointer}
input{cursor:text;min-width:200px}
button[aria-pressed=true],.primary{background:var(--accent);border-color:var(--accent)}
section{max-width:1200px;margin:auto;padding:12px 16px}
h3{margin:18px 0 0;font-size:.85rem;letter-spacing:3px;text-transform:uppercase;color:var(--dim)}
.shelf{display:grid;grid-template-columns:repeat(auto-fill,minmax(170px,1fr));gap:34px 24px;padding:24px 4px 30px;border-bottom:14px solid #1a1f36;box-shadow:0 18px 20px -14px #000;perspective:900px}
.case{all:unset;cursor:pointer;display:block;position:relative;aspect-ratio:540/760;border-radius:4px 8px 8px 4px;transform:rotateY(-14deg);transform-origin:left center;transition:transform .25s,box-shadow .25s;box-shadow:-8px 10px 18px #000a}
.case::before{content:"";position:absolute;left:0;top:0;bottom:0;width:10px;background:linear-gradient(90deg,#000,#2a2f45 60%,#000);border-radius:4px 0 0 4px;z-index:1}
.case img{width:100%;height:100%;display:block;border-radius:4px 8px 8px 4px}
.case:hover,.case:focus-visible{transform:rotateY(0) translateY(-10px) scale(1.04);box-shadow:0 20px 40px #000c,0 0 0 3px var(--accent)}
.case .new{position:absolute;top:-10px;right:-10px;background:var(--hot);font:800 .7rem system-ui;padding:4px 8px;border-radius:999px;z-index:2}
.label{margin-top:10px;font-size:.85rem;color:var(--dim);text-align:center}
#recent:empty,#recentH:has(+#recent:empty){display:none}
#recent{display:flex;gap:12px;overflow-x:auto;padding:12px 0}
#recent a{flex:none;display:flex;gap:10px;align-items:center;background:var(--card);padding:8px 14px 8px 8px;border-radius:10px;color:inherit;text-decoration:none}
#recent img{width:36px;border-radius:3px}
dialog{border:0;padding:0;background:var(--card);color:var(--text);border-radius:16px;max-width:820px;width:calc(100% - 32px);box-shadow:0 30px 80px #000}
dialog::backdrop{background:#000b;backdrop-filter:blur(4px)}
.detail{display:grid;grid-template-columns:260px 1fr;gap:24px;padding:24px}
.detail img{width:100%;border-radius:6px;box-shadow:0 10px 30px #000a}
.detail h2{margin:0 0 4px;font-size:1.6rem}
.meta{color:var(--dim);font-size:.85rem;margin-bottom:12px}
.detail ul{padding-left:18px;line-height:1.7;color:#cfd3f0}
.actions{display:flex;gap:10px;margin-top:16px}
.actions a{padding:10px 22px;border-radius:999px;background:var(--accent);color:#fff;text-decoration:none;font-weight:700}
@media (max-width:640px){.detail{grid-template-columns:1fr}.detail img{max-width:220px;margin:auto}.shelf{grid-template-columns:repeat(2,1fr)}}
</style>
</head>
<body>
<header>
  <h1>GXY<span>ARCADE</span></h1>
  <p>Every Biking People World minigame, boxed up and ready to play.</p>
  <div class="bar">
    <input id="q" type="search" placeholder="Search games…" aria-label="Search games">
    <span id="cats"></span>
    <button id="rand">🎲 Surprise me</button>
    <button id="install" class="primary" hidden>⬇ Install app</button>
  </div>
</header>
<section>
  <h3 id="recentH">Recently played</h3>
  <div id="recent"></div>
  <h3>The collection</h3>
  <div class="shelf" id="grid"></div>
</section>
<dialog id="dlg"><div class="detail">
  <img id="dImg" alt="">
  <div>
    <h2 id="dTitle"></h2>
    <div class="meta" id="dMeta"></div>
    <p id="dDesc"></p>
    <ul id="dFeat"></ul>
    <div class="actions"><span id="dPlay" style="display:contents"></span><button onclick="dlg.close()">Close</button></div>
  </div>
</div></dialog>
<script>
const GAMES=[
 {id:'supermarket-wars',t:'Supermarket Wars',c:'Tycoon',age:'10+',d:'Start with one store and build a nationwide grocery empire, or jump into a fast single-store round.',f:['Empire: campaign across 55+ towns in real metros','Empire: open, expand and remodel aging stores, battle rival chains','Quick Play: one store, short rounds, big decisions'],modes:[['▶ Empire','supermarket-wars'],['⚡ Quick Play','quickplay']]},
 {id:'tv-battles',t:'TV Battles: Station Tycoon',c:'Tycoon',age:'10+',d:'Own stations across a nation of cities and program every time slot.',f:['Morning news to late-night talk','License hits, gamble on pilots, or produce your own','Fight rivals for ratings']},
 {id:'gxy-tech-empire',t:'Technology Empire',c:'Tycoon',age:'10+',d:'Found a tech company in a garage and build a global empire.',f:['Research components across five eras','Design phones, laptops, watches and consoles','Out-market rival companies']},
 {id:'neon-siege',t:'Neon Siege',c:'Action',age:'12+',d:'A neon tower-defense gauntlet along a winding grid.',f:['Five turret types: blasters, cannons, frost, railguns, tesla','Upgrade paths for every tower','Escalating waves and bosses']},
 {id:'gxy-hockey',t:'GXY Hockey',c:'Sports',age:'E',d:'Hit the ice three ways.',f:['Fast-paced shootout','Full Career: franchise GM and player','Ice Legends card collecting']},
 {id:'gxy-football',t:'YOUFL Football',c:'Sports',age:'E',d:'Take the field with the YOUFL league teams.',f:['Play Now: call every down','Franchise: GM and coach across seasons','Player Career mode']},
 {id:'trivia',t:'GXY Trivia',c:'Puzzle',age:'T',d:'Pass-the-phone TV trivia, starting with 520 King of the Hill questions.',f:['Versus: 2–4 players, 10–20 rounds','Unlimited: 1–4 players, endless questions','Daily Challenge, streaks and a leaderboard']},
 {id:'price-guess',t:'Price Guess',c:'Puzzle',age:'E',d:'Guess the real price of grocery items photographed at real US stores.',f:['Real prices from shelf tags and receipts','Daily 5 with shareable results','Endless Free Play with a best score']},
 {id:'gxy-daily',t:'Daily Word',c:'Puzzle',age:'E',d:'A new Biking People World themed 5-letter word every day.',f:['Same puzzle for everyone','Six guesses','Streaks and daily leaderboard']}
];
const $=id=>document.getElementById(id);
const store={get(){try{return JSON.parse(localStorage.getItem('arcadeRecent'))||[]}catch{return[]}},set(v){try{localStorage.setItem('arcadeRecent',JSON.stringify(v))}catch{}}};
let cat='All';
['All',...new Set(GAMES.map(g=>g.c))].forEach(c=>{const b=document.createElement('button');b.textContent=c;b.onclick=()=>{cat=c;render()};$('cats').append(b,' ')});
function played(id){store.set([id,...store.get().filter(x=>x!==id)].slice(0,5))}
function render(){
  const s=$('q').value.toLowerCase(),seen=store.get();
  [...$('cats').children].forEach(b=>b.setAttribute('aria-pressed',b.textContent===cat));
  $('grid').innerHTML=GAMES.filter(g=>(cat==='All'||g.c===cat)&&(g.t+g.d+g.c).toLowerCase().includes(s))
    .map(g=>`<div><button class="case" data-id="${g.id}" aria-label="${g.t}"><img src="covers/${g.id}.svg" alt="" loading="lazy" decoding="async">${seen.includes(g.id)?'':'<span class="new">NEW</span>'}</button><div class="label">${g.t}</div></div>`).join('')||'<p>No games match.</p>';
  $('recent').innerHTML=seen.map(id=>GAMES.find(g=>g.id===id)).filter(Boolean)
    .map(g=>`<a href="games/${g.id}.html" data-play="${g.id}"><img src="covers/${g.id}.svg" alt="" loading="lazy">${g.t}</a>`).join('');
}
function open(id){
  const g=GAMES.find(x=>x.id===id);
  $('dImg').src=`covers/${g.id}.svg`;$('dTitle').textContent=g.t;$('dMeta').textContent=`${g.c} · Ages ${g.age} · Web`;
  $('dDesc').textContent=g.d;$('dFeat').innerHTML=g.f.map(x=>`<li>${x}</li>`).join('');
  $('dPlay').innerHTML=(g.modes||[['▶ Play now',g.id]]).map(([l,f])=>`<a href="games/${f}.html" data-play="${g.id}">${l}</a>`).join('');$('dlg').showModal();
}
document.addEventListener('click',e=>{
  const c=e.target.closest('.case');if(c)return open(c.dataset.id);
  const p=e.target.closest('[data-play]');if(p)played(p.dataset.play);
});
$('dlg').onclick=e=>{if(e.target===$('dlg'))$('dlg').close()};
$('rand').onclick=()=>open(GAMES[Math.floor(Math.random()*GAMES.length)].id);
$('q').oninput=render;render();
if('serviceWorker' in navigator) navigator.serviceWorker.register('sw.js');
let deferred;
addEventListener('beforeinstallprompt',e=>{e.preventDefault();deferred=e;$('install').hidden=false});
$('install').onclick=async()=>{deferred.prompt();await deferred.userChoice;deferred=null;$('install').hidden=true};
</script>
</body>
</html>
